[project]
    authors=[{name="Robert Adragna & Jeanne Salle", email="jeanne.salle@yahoo.fr"}]
    dependencies=[
        "anthropic>=0.49.0",
        "datasets>=3.2.0",
        "inspect-evals",
        "matplotlib>=3.10.0",
        "openai>=1.78.0",
        "pylint>=3.3.3",
        "pyright>=1.1.382",
        "pytest-asyncio>=0.24.0",
        "pytest-mock>=3.14.0",
        "pytest>=8.3.3",
        "regex>=2024.11.6",
        "ruff>=0.6.8",
        "jinja2>=3.1.5",
        "seaborn>=0.13.2",
        "scipy>=1.15.1",
        "networkx>=3.4.2",
        "pydot>=3.0.4",
        "ipykernel>=6.29.5",
        "pip>=25.0.1",
        "ipywidgets>=8.1.5",
        "inspect-ai>=0.3.99",
        "statsmodels>=0.14.4",
        "tabulate>=0.9.0",
        "scikit-learn>=1.7.0",
        "transformers>=4.53.2",
        "pydantic>=2.10.6",
]
    description="A short description of the evaluation"
    name="sandbagging_across_tasks"
    readme="README.md"
    requires-python=">=3.12"
    version="0.1.0"

[build-system]
    build-backend="hatchling.build"
    requires=["hatchling"]

[tool.hatch]
    [tool.hatch.metadata]
        allow-direct-references=true

    [tool.hatch.build.targets.wheel]
        packages = ["src", "plotting"]

[tool.poe]
    [tool.poe.tasks]
        [tool.poe.tasks.check]
            help="All checks"
            ignore_fail=false
            sequence=["format", "lint", "test", "typecheck"]

        [tool.poe.tasks.test]
            cmd="uv run pytest"
            help="Run tests"

        [tool.poe.tasks.typecheck]
            cmd="uv run pyright"
            help="Type check"

        [tool.poe.tasks.format]
            cmd="uv run ruff format ."
            help="Format code (with autofix)"

        [tool.poe.tasks.lint]
            cmd="uv run ruff check . --fix"
            help="Lint (with autofix)"

[tool.pytest]

    [tool.pytest.ini_options]
        addopts=[
            # Use modern Python imports (i.e., don't require __init__.py files everywhere)
            "--import-mode=importlib",
            # Require markers to be explicitly defined
            "--strict-markers",
        ]
        asyncio_default_fixture_loop_scope="function"
        asyncio_mode="auto"
        markers=[
            "calls_llm: tests that make language model api calls",
            "slow: slow tests",
        ]
        pythonpath="."

[tool.ruff]
    exclude=["**/assets"]
    include=["sandbagging_on_agentic_tasks"]
    line-length=88
    [tool.ruff.lint]
        ignore=[
            "D10",  # Require docstrings for all public methods
            "E501", # Line too long
            "N816", # Global variable should be snake_case (prevents acronyms)
            "N999", # Module variable should be snake_case (prevents acronyms)
            "S101", # Use of assert detected (needed for testing)
            "S311", # Pseudo-random generators not suitable for cryptographic purposes (not our use case)
            "S603", # subprocess call - check for execution of untrusted input (we need this to run ruff / pyright from python)
            "S607", # Starting a process with a partial executable path (we need this to run ruff / pyright from python)
            "I001", # Import block is un-sorted or un-formatted
        ]
        select=[
            "A",     # flake8-builtins (detects use of python builtins)
            "ASYNC", # flake8-async (common async issues)
            "B",     # flake8-bugbear (common bugs and design problems)
            "C",     # mccabe (complexity checker)
            "D",     # pydocstyle (docstring style checker)
            "E",     # pycodestyle errors (PEP8 code style requirements)
            "F",     # pyflakes (detects coding errors)
            "I",     # isort (import sorting)
            "N",     # flake8 (variable naming conventions)
            "S",     # flake8-bandit (security issues)
            "UP",    # Conform to latest Python PEP style guideliness
        ]

        [tool.ruff.lint.pydocstyle]
            convention="google"

        [tool.ruff.lint.pep8-naming]
            # Allow Pydantic's `@validator` decorator to trigger class method treatment.
            classmethod-decorators=["classmethod", "pydantic.validator"]

[tool.pyright]
    exclude=["**/assets", ".venv"]
    include=["sandbagging_across_tasks"]
    reportAssertAlwaysTrue=true
    reportDeprecated=true
    reportUnusedImport=true
    reportWildcardImportFromLibrary=true

[tool.uv.sources]
    inspect-evals={git="https://github.com/UKGovernmentBEIS/inspect_evals"}
